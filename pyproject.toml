[build-system]
requires = ["setuptools>=77"]  # licencia como expresión SPDX
build-backend = "setuptools.build_meta"

[project]
name = "generos-musicales"
version = "0.1.0"
description = "Clasificación de géneros musicales con MFCC: red densa frente a LSTM, con salsa, vallenato, reguetón y rock en español"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Santiago Castellanos" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not notebooks'"
markers = ["notebooks: ejecuta los notebooks completos (lento; correr con -m notebooks)"]
